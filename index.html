<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Feliz Día Pa</title>
</head>
<body>
  <audio id="player" autoplay loop playsinline>
    <source src="felizdiapa.ogg" type="audio/ogg">
    Tu navegador no soporta OGG.
  </audio>

  <script>
    const player = document.getElementById('player');
    // Intento reproducir con sonido
    player.muted = false;
    player.play().catch(() => {
      // Si el navegador bloquea, arranca en mute
      player.muted = true;
      player.play();
    });
  </script>
</body>
</html>
